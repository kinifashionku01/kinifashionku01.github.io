<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kini Fashion</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
    font-family:'Poppins',sans-serif;
    min-height:100vh;
    background: linear-gradient(135deg,#ffdde1,#ee9ca7);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:380px;
    background:rgba(255,255,255,0.18);
    backdrop-filter: blur(15px);
    border-radius:30px;
    padding:35px 25px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,0.15);
}

.logo{
    width:110px;
    height:110px;
    margin:auto;
    border-radius:50%;
    background:linear-gradient(135deg,#ff4b2b,#ff416c);
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    font-size:42px;
    font-weight:700;
}

h1{
    margin-top:18px;
    font-size:30px;
    color:white;
}

.desc{
    color:white;
    margin-top:8px;
    margin-bottom:30px;
    font-size:14px;
}

.link-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    width:100%;
    padding:17px;
    border-radius:18px;
    text-decoration:none;
    color:white;
    font-size:17px;
    font-weight:600;
    margin-bottom:18px;
}

.shopee{
    background:#ee4d2d;
}

.tiktok{
    background:#000;
}

.footer{
    margin-top:20px;
    color:white;
    font-size:12px;
}
</style>
</head>
<body>

<div class="container">

<div class="logo">KF</div>

<h1>Kini Fashion</h1>

<div class="desc">
Fashion Trend • Harga Terbaik • Belanja Mudah
</div>

<a class="link-btn shopee" href="https://bit.ly/kinifashionku01" target="_blank">
🛍️ Shopee Store
</a>

<a class="link-btn tiktok" href="https://vt.tokopedia.com/t/ZS9YVrDgdrPUu-R7ocQ/" target="_blank">
🎵 TikTok Shop
</a>

<div class="footer">
© 2026 Kini Fashion
</div>

</div>

</body>
</html>

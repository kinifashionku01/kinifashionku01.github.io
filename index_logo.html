
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kini Fashion</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Poppins',sans-serif;
min-height:100vh;
background:linear-gradient(135deg,#f8d7da,#f5c6cb,#fbe4e6);
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.container{
width:100%;
max-width:400px;
background:rgba(255,255,255,0.18);
backdrop-filter:blur(15px);
border-radius:30px;
padding:35px 25px;
text-align:center;
box-shadow:0 10px 30px rgba(0,0,0,0.15);
border:1px solid rgba(255,255,255,0.3);
}

.logo-img{
width:140px;
height:140px;
border-radius:50%;
object-fit:cover;
margin-bottom:15px;
box-shadow:0 8px 20px rgba(0,0,0,0.2);
border:4px solid rgba(255,255,255,0.5);
}

h1{
font-size:32px;
color:white;
font-weight:700;
margin-bottom:8px;
}

.desc{
color:white;
font-size:14px;
margin-bottom:28px;
opacity:0.95;
}

.link-btn{
display:flex;
align-items:center;
justify-content:center;
gap:10px;
width:100%;
padding:17px;
border-radius:18px;
text-decoration:none;
color:white;
font-size:17px;
font-weight:600;
margin-bottom:18px;
transition:0.3s;
}

.link-btn:hover{
transform:translateY(-3px);
}

.shopee{
background:#ee4d2d;
}

.tiktok{
background:#000;
}

.footer{
margin-top:18px;
color:white;
font-size:12px;
opacity:0.8;
}
</style>
</head>

<body>

<div class="container">

<img src="logo.png" class="logo-img" alt="Kini Fashion Logo">

<h1>Kini Fashion</h1>

<div class="desc">
Fashion Muslimah • Elegant • Trendy
</div>

<a class="link-btn shopee" href="https://bit.ly/kinifashionku01" target="_blank">
🛍️ Shopee Store
</a>

<a class="link-btn tiktok" href="https://vt.tokopedia.com/t/ZS9YVrDgdrPUu-R7ocQ/" target="_blank">
🎵 TikTok Shop
</a>

<div class="footer">
© 2026 Kini Fashion
</div>

</div>

</body>
</html>
